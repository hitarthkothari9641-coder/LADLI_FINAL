<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setup Security | LADLI Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css">
<link rel="stylesheet" href="/admin/assets/admin_responsive.css">
<link rel="icon" href="/assets/images/favicon.ico">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card" style="max-width:500px;">
    <div class="auth-logo"><img src="/assets/images/ladli-logo.webp" alt="LADLI"></div>
    <h1>Security Setup</h1>
    <p class="sub">Set up your security questions to recover your password in the future.</p>

    <div class="form-error" id="setup-error" role="alert">
      <span class="form-error-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 8v5M12 16.5h.01M12 3l9.5 17H2.5L12 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="form-error-text" id="setup-error-text"></span>
    </div>

    <form id="setup-form" autocomplete="off">
      <div id="questions-container">
        <!-- JS will populate 3 sets of selects and inputs -->
      </div>
        <button class="btn btn-primary btn-block" type="submit" id="setup-btn" style="margin-top: 20px;">Save Security Questions</button>
    </form>
  </div>
</div>

<script src="/admin/assets/admin.js"></script>
<script>
(async () => {
  const me = await fetch('/api/admin/me', { credentials: 'same-origin' }).then(r => r.json()).catch(() => null);
  if (!me || !me.logged_in) {
    window.location.href = '/admin/login';
    return;
  }
  if (me.security_setup_completed) {
    window.location.href = '/admin';
    return;
  }

  loadQuestions();
})();

let allQuestions = [];
</script>
</body>
</html>
