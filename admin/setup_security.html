<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setup Security | LADLI Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css">
<link rel="icon" href="/assets/images/favicon.ico">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card" style="max-width:500px;">
    <div class="auth-logo"><img src="/assets/images/ladli-logo.webp" alt="LADLI"></div>
    <h1>Security Setup</h1>
    <p class="sub">Set up your security questions to recover your password in the future.</p>

    <div class="form-error" id="setup-error" role="alert">
      <span class="form-error-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 8v5M12 16.5h.01M12 3l9.5 17H2.5L12 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="form-error-text" id="setup-error-text"></span>
    </div>

    <form id="setup-form" autocomplete="off">
      <div id="questions-container">
        <!-- JS will populate 3 sets of selects and inputs -->
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="setup-btn" style="margin-top: 20px;">Save Security Questions</button>
    </form>
  </div>
</div>

<script src="/admin/assets/admin.js"></script>
<script>
(async () => {
  const me = await fetch('/api/admin/me', { credentials: 'same-origin' }).then(r => r.json()).catch(() => null);
  if (!me || !me.logged_in) {
    window.location.href = '/admin/login';
    return;
  }
  if (me.security_setup_completed) {
    window.location.href = '/admin';
    return;
  }
  
  loadQuestions();
})();

let allQuestions = [];

async function loadQuestions() {
  try {
    const res = await Admin.api('/api/admin/security-questions');
    allQuestions = res.questions;
    renderForm();
  } catch (err) {
    showError('Failed to load security questions.');
  }
}

function renderForm() {
  const container = document.getElementById('questions-container');
  let html = '';
  for (let i = 0; i < 3; i++) {
    html += `
      <div class="field">
        <label for="q${i}">Security Question ${i + 1}</label>
        <select id="q${i}" name="q${i}" class="q-select" required aria-label="Security Question ${i + 1}">
          <option value="">-- Select a question --</option>
          ${allQuestions.map(q => `<option value="${Admin.escapeHtml(q)}">${Admin.escapeHtml(q)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin-bottom: 24px;">
        <label for="a${i}">Answer</label>
        <input id="a${i}" name="a${i}" type="text" required aria-label="Answer ${i + 1}" minlength="2">
      </div>
    `;
  }
  container.innerHTML = html;

  const selects = Array.from(document.querySelectorAll('.q-select'));
  selects.forEach(sel => {
    sel.addEventListener('change', () => {
      // Prevent duplicates
      const selectedValues = selects.map(s => s.value).filter(v => v);
      const hasDuplicates = new Set(selectedValues).size !== selectedValues.length;
      if (hasDuplicates) {
        sel.value = '';
        showError('You must choose 3 distinct questions.');
      } else {
        clearError();
      }
    });
  });
}

const errorEl = document.getElementById('setup-error');
const errorTextEl = document.getElementById('setup-error-text');

function showError(msg) {
  errorTextEl.textContent = msg;
  errorEl.classList.add('is-visible');
}
function clearError() {
  errorEl.classList.remove('is-visible');
}

document.getElementById('setup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  
  const questions = [
    document.getElementById('q0').value,
    document.getElementById('q1').value,
    document.getElementById('q2').value
  ];
  const answers = [
    document.getElementById('a0').value.trim(),
    document.getElementById('a1').value.trim(),
    document.getElementById('a2').value.trim()
  ];

  if (new Set(questions).size !== 3) {
    showError('Please select 3 distinct questions.');
    return;
  }

  if (answers.some(a => a.length < 2)) {
    showError('All answers must be at least 2 characters long.');
    return;
  }

  const btn = document.getElementById('setup-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    await Admin.api('/api/admin/setup-security-questions', {
      method: 'POST',
      body: JSON.stringify({ questions, answers })
    });
    window.location.href = '/admin';
  } catch (err) {
    showError(err.message || 'Failed to save security questions.');
    btn.disabled = false;
    btn.textContent = 'Save Security Questions';
  }
});
</script>
</body>
</html>
