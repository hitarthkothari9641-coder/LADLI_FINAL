<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password | LADLI Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css">
<link rel="icon" href="/assets/images/favicon.ico">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card" id="recovery-card">
    <div class="auth-logo"><img src="/assets/images/ladli-logo.webp" alt="LADLI"></div>
    <h1>Account Recovery</h1>
    <p class="sub" id="step-description">Enter your username to begin.</p>

    <div class="form-error" id="recovery-error" role="alert">
      <span class="form-error-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 8v5M12 16.5h.01M12 3l9.5 17H2.5L12 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="form-error-text" id="recovery-error-text"></span>
    </div>

    <!-- Step 1: Username -->
    <form id="step1-form" autocomplete="off">
      <div class="field">
        <label for="username">Admin Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required aria-label="Username">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="step1-btn">Continue</button>
    </form>

    <!-- Step 2: Security Questions -->
    <form id="step2-form" autocomplete="off" style="display:none;">
      <div id="questions-container"></div>
      <button class="btn btn-primary btn-block" type="submit" id="step2-btn">Verify Answers</button>
    </form>

    <!-- Step 3: New Password -->
    <form id="step3-form" autocomplete="off" style="display:none;">
      <div class="field">
        <label for="new-password">New Password</label>
        <div class="password-field">
          <input id="new-password" name="new_password" type="password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm New Password</label>
        <div class="password-field">
          <input id="confirm-password" name="confirm_password" type="password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="step3-btn">Reset Password</button>
    </form>

    <div id="step4-success" style="display:none;text-align:center;">
      <div class="form-success is-visible">Password reset successful.</div>
      <a href="/admin/login" class="btn btn-primary">Go to Login</a>
    </div>

    <p class="auth-foot"><a href="/admin/login">Back to sign in</a></p>
  </div>
</div>

<script src="/admin/assets/admin.js"></script>
<script>
Admin.wirePasswordToggles();
const errorEl = document.getElementById('recovery-error');
const errorTextEl = document.getElementById('recovery-error-text');

let recoveryUsername = '';
let resetToken = '';

function showError(msg) {
  errorTextEl.textContent = msg;
  errorEl.classList.add('is-visible');
}
function clearError() {
  errorEl.classList.remove('is-visible');
}

document.getElementById('step1-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const btn = document.getElementById('step1-btn');
  btn.disabled = true;
  const username = document.getElementById('username').value.trim();

  try {
    const res = await Admin.api('/api/admin/get-user-questions', {
      method: 'POST',
      body: JSON.stringify({ username })
    });
    
    // Always returns 3 questions, even fake ones for non-existent users
    recoveryUsername = username;
    document.getElementById('step1-form').style.display = 'none';
    
    const qHtml = res.questions.map((q, i) => `
      <div class="field">
        <label for="q${i}">${Admin.escapeHtml(q)}</label>
        <input id="q${i}" name="q${i}" type="text" required aria-label="Answer ${i+1}">
      </div>
    `).join('');
    
    document.getElementById('questions-container').innerHTML = qHtml;
    document.getElementById('step2-form').style.display = 'block';
    document.getElementById('step-description').textContent = 'Answer your security questions to recover your account.';

  } catch (err) {
    showError(err.message || 'An error occurred.');
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('step2-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const btn = document.getElementById('step2-btn');
  btn.disabled = true;

  const answers = [
    document.getElementById('q0').value.trim(),
    document.getElementById('q1').value.trim(),
    document.getElementById('q2').value.trim()
  ];

  try {
    const res = await Admin.api('/api/admin/verify-security-answers', {
      method: 'POST',
      body: JSON.stringify({ username: recoveryUsername, answers })
    });
    
    resetToken = res.reset_token;
    document.getElementById('step2-form').style.display = 'none';
    document.getElementById('step3-form').style.display = 'block';
    document.getElementById('step-description').textContent = 'Create a new password.';
  } catch (err) {
    showError(err.message || 'Verification failed.');
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('step3-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const btn = document.getElementById('step3-btn');
  const pwd = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;

  if (pwd !== confirm) {
    showError('Passwords do not match.');
    return;
  }

  btn.disabled = true;
  try {
    await Admin.api('/api/admin/reset-password-with-token', {
      method: 'POST',
      body: JSON.stringify({ username: recoveryUsername, token: resetToken, new_password: pwd })
    });
    
    document.getElementById('step3-form').style.display = 'none';
    document.getElementById('step-description').style.display = 'none';
    document.getElementById('step4-success').style.display = 'block';
  } catch (err) {
    showError(err.message || 'Failed to reset password.');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
