# =============================================================================
# render.yaml — Primary deployment target: Render + PostgreSQL
# =============================================================================
# Create the stack:  Render Dashboard → New → Blueprint → pick this repo.
# Verify current plan availability, database expiry, backups and capacity with the owner.
#
# Notes about the free tier:
#   * Free web services sleep after ~15 min of inactivity and cold-start in
#     ~30-60 s on the next request. This is expected, not a bug.
#   * The free PostgreSQL instance is fully managed; back it up before its
#     expiry date shown in the Render dashboard.
#   * Free instances have an ephemeral disk, so quote-attachment PDFs are
#     only durable when AWS S3 is configured (AWS_S3_BUCKET / AWS_REGION /
#     credentials). Production uploads are rejected without S3; enquiries
#     without attachments and public pages remain available.
# =============================================================================

databases:
  - name: ladli-db
    databaseName: ladli_db
    user: ladli_app
    plan: free

services:
  - type: web
    name: ladli
    runtime: python
    plan: free
   
    # No `branch:` pin on purpose — Render deploys whichever branch you select
    # when applying the Blueprint, so this works before the PR is merged too.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    # Public pages stay available during a DB outage; /ready checks the DB.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # --- Database (wired automatically from the free Postgres above) -----
      - key: DATABASE_URL
        fromDatabase:
          name: ladli-db
          property: connectionString
      - key: PGSSLMODE
        value: require

      # --- Flask ------------------------------------------------------------
      - key: SECRET_KEY
        generateValue: true     # Render generates a strong random value
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: FORCE_SECURE_COOKIES
        value: "true"
      # Configure actual trusted peers before enabling forwarded client IPs.
      - key: TRUSTED_PROXY_COUNT
        value: "0"
      - key: GUNICORN_FORWARDED_ALLOW_IPS
        value: "127.0.0.1,::1"
      - key: ALLOW_SECURITY_QUESTION_RECOVERY
        value: "false"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: DB_LOCK_TIMEOUT_MS
        value: "5000"

      # --- Gunicorn (small footprint for the 512 MB free instance) ---------
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"

      # --- First-run admin account -----------------------------------------
      # Set ADMIN_PASSWORD yourself in the Render dashboard (marked sync:false
      # so it is never stored in git). Change it after the first login.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # --- Required for production attachment uploads: AWS S3 storage ------------------------------
      # - key: AWS_S3_BUCKET
      #   sync: false
      # - key: AWS_REGION
      #   value: ap-south-1
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
